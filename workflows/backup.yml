name: HTML Backup

on:
  schedule:
    - cron: '17 11 * * 1'   # Every Monday at 11:17 AM UTC
  workflow_dispatch:          # Allow manual trigger from GitHub Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up date for email subject
        id: date
        run: echo "TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Send HTML backup via Gmail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Flow Cytometer Booking — Weekly HTML Backup (${{ steps.date.outputs.TODAY }})"
          to: matthewolson.lab@gmail.com
          from: Flow Cytometer Backup <${{ secrets.GMAIL_USER }}>
          body: |
            Hi,

            Please find attached the weekly HTML backup of the Flow Cytometer Booking System.

            Generated: ${{ steps.date.outputs.TODAY }}
            Source: ${{ github.repository }}

            — GitHub Actions (automated)
          attachments: index.html
