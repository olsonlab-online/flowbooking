name: HTML Backup

on:
  schedule:
    - cron: '17 11 * * 1'   # Every Monday at 11:17 AM UTC
  workflow_dispatch:          # Allow manual trigger from GitHub Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate usage report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node generate_report.js

      - name: Get report filename
        id: filename
        run: echo "FILE=$(ls flow-cytometer-report-*.html)" >> $GITHUB_OUTPUT

      - name: Set date for email subject
        id: date
        run: echo "TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Email report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Flow Cytometer — Weekly Usage Report (${{ steps.date.outputs.TODAY }})"
          to: matthewolson.lab@gmail.com
          from: Flow Cytometer Backup <${{ secrets.GMAIL_USER }}>
          body: |
            Hi,

            Please find attached the weekly usage report for the Flow Cytometer Booking System (HANS 301).

            Report period: past 4 weeks up to ${{ steps.date.outputs.TODAY }}
            Generated by: GitHub Actions

            Open the attached HTML file in any browser to view the full report with sortable tables.

            — Automated Weekly Backup
          attachments: ${{ steps.filename.outputs.FILE }}
